[package]
name = "ghostproof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Scoped names and trusted evidence for Ghosts of Departed Proofs"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["gdp", "proof", "authorization", "typestate", "no-std"]
categories = ["no-std", "rust-patterns"]

[workspace]
members = ["crates/ghostproof-macros", "crates/cargo-gdp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rajaniraiyn/gdp-rs"

[workspace.dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", default-features = false }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
macros = ["dep:ghostproof-macros"]

[dependencies]
generativity = "1.2.1"
ghostproof-macros = { version = "0.1.0", path = "crates/ghostproof-macros", optional = true }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }

[[example]]
name = "authorization"
required-features = ["macros"]

[[example]]
name = "validation"
required-features = ["macros"]

[[example]]
name = "relationships"
required-features = ["macros"]

[[example]]
name = "overhead"
required-features = ["macros"]

[[example]]
name = "versioned"
required-features = ["macros"]
test = true

[[example]]
name = "configuration"
required-features = ["macros"]
test = true

[lints]
workspace = true
