[package]
name = "cargo-gdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cargo checks and narrow syntax diagnostics for Ghosts of Departed Proofs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Rajaniraiyn/gdp-rs"

[dependencies]
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints.rust]
unsafe_code = "forbid"
